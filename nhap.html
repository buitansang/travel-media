<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xem trước carousel — Simo</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b1119;color:#e8eef4;
       font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
       -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:#0b1119f2;backdrop-filter:blur(10px);
         border-bottom:1px solid #1c2836;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .hrow{display:flex;align-items:center;gap:10px}
  select{flex:1;min-width:0;background:#16222f;color:#e8eef4;
         border:1px solid #233242;border-radius:9px;padding:9px 10px;font-size:14px;
         font-family:inherit;-webkit-appearance:none;appearance:none}
  h1{margin:9px 0 0;font-size:15px;font-weight:600;line-height:1.42;color:#cfe0ee}
  .meta{margin-top:5px;font-size:12px;color:#7f97ab}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;
       margin-right:5px;vertical-align:1px}

  /* ----- carousel: cuon ngang, snap tung tam - dung nhu vuot tren TikTok ----- */
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
        padding:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .slide{flex:0 0 auto;scroll-snap-align:center;position:relative}
  .slide img{display:block;width:min(78vw,340px);aspect-ratio:9/16;object-fit:cover;
             border-radius:14px;background:#131e2a;box-shadow:0 8px 28px #0006}
  .num{position:absolute;top:10px;left:10px;background:#0b1119cc;backdrop-filter:blur(4px);
       font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.4px}
  .num.cover{background:#b4832bdd}
  .num.cta{background:#12556fdd}

  .bar{display:flex;gap:5px;justify-content:center;padding:0 16px 14px}
  .bar i{height:3px;flex:1;max-width:34px;border-radius:2px;background:#243444;transition:background .2s}
  .bar i.on{background:#5fb3d4}

  .wrap{padding:0 16px 40px;max-width:680px;margin:0 auto}
  .card{background:#111c28;border:1px solid #1e2c3c;border-radius:13px;padding:14px;margin-bottom:14px}
  .card h2{margin:0 0 9px;font-size:13px;font-weight:700;color:#8fb0c8;
           text-transform:uppercase;letter-spacing:.7px}
  .cap{font-size:14px;line-height:1.62;white-space:pre-wrap;word-break:break-word;color:#dbe6f0}
  button{background:#12556f;color:#fff;border:0;border-radius:9px;padding:10px 15px;
         font-size:14px;font-weight:600;font-family:inherit;margin-top:11px}
  button:active{background:#0e4459}
  .pts{list-style:none;margin:0;padding:0;font-size:13.5px;line-height:1.5}
  .pts li{padding:8px 0;border-top:1px solid #1a2733;display:flex;gap:10px}
  .pts li:first-child{border-top:0}
  .pts b{color:#7f97ab;font-weight:600;flex:0 0 20px}
  .empty{color:#7f97ab;text-align:center;padding:70px 20px;line-height:1.7}
</style></head><body>

<header>
  <div class="hrow"><select id="pick" onchange="show(this.value)"></select></div>
  <h1 id="title">Đang tải…</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="rail" id="rail"></div>
<div class="bar" id="bar"></div>

<div class="wrap">
  <div class="card">
    <h2>Caption</h2>
    <div class="cap" id="cap"></div>
    <button onclick="copyCap()" id="cpbtn">Copy caption</button>
  </div>
  <div class="card">
    <h2>Chữ trên từng tấm</h2>
    <ul class="pts" id="pts"></ul>
  </div>
</div>

<script>
var DATA = [], cur = null;

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function show(slug){
  var p = DATA.find(function(x){ return x.slug === slug; });
  if(!p) return;
  cur = p;
  var _pk = document.getElementById('pick'); if(_pk) _pk.value = slug;
  document.getElementById('title').textContent = p.title || p.slug;

  var imgs = p.images || [];
  document.getElementById('meta').innerHTML =
    (p.posted ? '<span class="dot"></span>đã vào draft · ' : '') + imgs.length + ' tấm';

  // Cot 'dia_danh' trong manifest la ten tung tam noi bang '|' - tam 1 la bia,
  // tam cuoi la CTA, o giua moi la dia diem that.
  var names = String(p.dia_danh || '').split('|').map(function(s){ return s.trim(); });
  var subs  = String(p.phu_de   || '').split('|').map(function(s){ return s.trim(); });

  document.getElementById('rail').innerHTML = imgs.map(function(u, i){
    var kind = i === 0 ? 'cover' : (i === imgs.length - 1 ? 'cta' : '');
    var tag  = i === 0 ? 'BÌA' : (i === imgs.length - 1 ? 'CTA' : (i + 1));
    return '<div class="slide"><span class="num ' + kind + '">' + tag + '</span>' +
           '<img loading="lazy" src="' + esc(u) + '"></div>';
  }).join('');

  document.getElementById('bar').innerHTML =
    imgs.map(function(_, i){ return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join('');

  document.getElementById('cap').textContent = p.caption || '(không có caption)';

  document.getElementById('pts').innerHTML = imgs.map(function(_, i){
    var lines = (subs[i] || '').split('\n').filter(function(s){ return s.trim(); });
    return '<li><b>' + (i + 1) + '</b><span><strong>' + esc(names[i] || '—') + '</strong>' +
           (lines.length ? '<br>' + lines.map(esc).join('<br>') : '') + '</span></li>';
  }).join('');

  document.getElementById('rail').scrollLeft = 0;
}

// Cham sang tam nao thi to cham do - dung IntersectionObserver de khong phai
// tinh toan lai vi tri moi lan cuon.
var rail = document.getElementById('rail');
rail.addEventListener('scroll', function(){
  var slides = rail.querySelectorAll('.slide');
  if(!slides.length) return;
  var mid = rail.scrollLeft + rail.clientWidth / 2, best = 0, bd = 1e9;
  slides.forEach(function(s, i){
    var c = s.offsetLeft + s.offsetWidth / 2, d = Math.abs(c - mid);
    if(d < bd){ bd = d; best = i; }
  });
  var dots = document.getElementById('bar').children;
  for(var i = 0; i < dots.length; i++) dots[i].className = (i === best ? 'on' : '');
}, {passive:true});

function copyCap(){
  if(!cur) return;
  var b = document.getElementById('cpbtn');
  navigator.clipboard.writeText(cur.caption || '').then(function(){
    b.textContent = 'Đã copy ✓';
    setTimeout(function(){ b.textContent = 'Copy caption'; }, 1600);
  });
}

9 năm nay cho biết có khu vực chưa vào được, nên hỏi trước khi đi xa. Gửi xe miễn phí.\n📍 Nhà thờ chính tòa Bùi Chu (Xuân Trường) — Đây là điểm dễ hụt hẫng nhất nếu chỉ xem ảnh trên mạng. Nhà thờ cũ khánh thành năm 1885, sau vụ tranh cãi về bảo tồn đã được hạ giải ngày 16/7/2020. Nhà thờ mới giữ nguyên hình dáng và kiến trúc cũ nhưng vật liệu tốt hơn, dài 72,5m, rộng 18m, cao 18,2m, bỏ trần để lòng nhà thờ thoáng hơn. Và đây là thời điểm đặc biệt: theo trang giáo phận Bùi Chu, ngày 25/9/2026 nhà thờ mới sẽ được khánh thành và cung hiến. Vùng đất này đón Tin Mừng từ khoảng năm 1670.\n📍 Nhà thờ Hưng Nghĩa (Hải Hưng) — Nhà thờ Gothic tông đen xám rất lạ, nhiều người ví như một tiểu lâu đài châu Âu mọc giữa vùng quê ven biển Hải Hậu. Hai tháp chuông cao vút, quy mô nổi trội hẳn so với nhà dân xung quanh. Ban quản lý mở cửa cho khách tham quan tự do, có bãi đỗ xe rộng ngay đối diện. Nói thật một điều: có khách thấy công trình đồ sộ nhưng chi tiết chưa tinh xảo bằng kỳ vọng, và thời gian này nhà thờ đang sửa chữa nên vài chỗ còn ngổn ngang.\n📍 Đền Thánh Kiên Lao (Xuân Trường) — Khởi công ngày 1/8/1994, hoàn thành 28/12/1997 và được dâng kính Thánh Gia. Dài 75m, rộng 26m, cao 28m, tháp chuông vươn tới 46m — cao hơn cả tháp chuông Phú Nhai. Kiến trúc pha trộn Á và Âu với hoa văn đắp nổi cầu kỳ. Đường vào khá nhỏ, phải qua một cây cầu hẹp và đi ngang chợ, xe lớn nên cân nhắc.\n💡 Tips du lịch:\n• Phú Nhai, Bùi Chu và Kiên Lao đều ở Xuân Trường, cách nhau 4 đến 5km, đi chung một buổi\n• Hưng Nghĩa cách cụm Xuân Trường khoảng 8 đến 11km\n• Sở Kiện nằm xa hơn hẳn, ở phía Hà Nam cũ, nên tách thành một buổi riêng\n• Vào nhà thờ nhớ mặc kín đáo, tránh giờ đang có thánh lễ\n• Từ 01/07/2025 Hà Nam và Nam Định đã nhập vào Ninh Bình, Maps đã đổi tên tỉnh\nBạn sẽ đi Phú Nhai hay canh ngày 25/9 để xem Bùi Chu cung hiến?\n#ninhbinh #namdinh #hanam #phunhai #buichu #kinhnghiemdulich", "dia_danh": "Ninh Bình | VCTĐ Phú Nhai | VCTĐ Phú Nhai | VCTĐ Sở Kiện | Nhà thờ chính tòa Bùi Chu | Nhà thờ chính tòa Bùi Chu | Nhà thờ Hưng Nghĩa | Đền Thánh Kiên Lao | Ninh Bình", "phu_de": "Ninh Bình giữ 2 trong 4 vương cung thánh đường cả nước\nNam Định và Hà Nam cũ, giờ chung một tỉnh | Một trong bốn vương cung thánh đường Việt Nam\nGothic Pháp, dài 80m, hai tháp chuông cao 44m\nĐược nâng lên hàng vương cung thánh đường năm 2008 | Nhà thờ đầu bị bão 1929 phá, xây lại xong 1933\nNgày 8/12 là lễ chính, khách hành hương về đông\nKhông phải lúc nào bên trong cũng mở cửa | Xây 1877, khánh thành 1883, từng là nhà thờ chính tòa\nNền lót gỗ lim chống lún vì xây trên đầm\nĐang sửa chữa, có khu vực chưa vào được | Nhà thờ cũ 1885 đã hạ giải tháng 7/2020\nNhà thờ mới giữ nguyên hình dáng kiến trúc cũ\nDài 72,5m, rộng 18m, cao 18,2m | Khánh thành và cung hiến ngày 25/9/2026\nẢnh nhà thờ cổ trên mạng giờ không còn đúng\nGiáo phận đón Tin Mừng từ khoảng năm 1670 | Gothic tông đen xám, nhiều người ví như châu Âu\nMở cửa cho khách tham quan, bãi đỗ xe đối diện\nĐang sửa chữa nên có chỗ còn ngổn ngang | Xây từ 1994, hoàn thành cuối năm 1997\nTháp cao 46m, cao hơn tháp chuông Phú Nhai\nĐường vào nhỏ, qua cầu hẹp và chợ | Mỗi ngày 1 điểm đến Việt Nam\nTips thật từ review khách đi\nTheo dõi Simo để không bỏ lỡ", "posted": false}, {"slug": "can-tho-p2", "title": "Cần Thơ chơi gì phần 2: 5 điểm ngoài chợ nổi, chỗ nào đáng tiền", "images": ["https://buitansang.github.io/travel-media/nhap/can-tho-p2/1.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/2.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/3.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/4.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/5.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/6.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/7.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/8.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/9.jpg?v=2"], "caption": "Cần Thơ chơi gì phần 2: 5 điểm ngoài chợ nổi, chỗ nào đáng tiền\n\nBài trước đã có chợ nổi Cái Răng, bến Ninh Kiều, Giàn Gừa. Đây là 5 điểm còn lại — và nói thật chỗ nào đáng bỏ tiền, chỗ nào chụp bên ngoài là đủ.\n📍 Lò hủ tiếu Sáu Hoài (An Bình) — Cách chợ nổi Cái Răng khoảng 2km, đi đò qua con rạch nhỏ chừng 5 đến 10 phút, nhiều lái đò cho ghé luôn sau khi đi chợ. Được xem cách làm hủ tiếu: buổi sáng tráng bánh, buổi chiều cắt sợi. Lò còn làm hủ tiếu ngũ sắc bằng màu tự nhiên — xanh từ lá dứa, đỏ từ gấc, vàng từ nghệ, tím từ lá cẩm. Món nên thử là pizza hủ tiếu — hủ tiếu chiên giòn từng nắm. Đi ô tô thì đỗ gần cầu rồi đi bộ khoảng 100m vào hẻm, mùa mưa hẻm có thể ngập. Có bán đặc sản, nhưng có review nói đồ gỗ bày bán không phải làm tại chỗ, nên xem kỹ trước khi mua.\n📍 Làng du lịch Mỹ Khánh (An Bình, Phong Điền cũ) — Hơn 6.000 lượt đánh giá trên Google Maps. Vé cổng khoảng 150k, trẻ dưới 1m miễn phí, vào trong các trò chơi mua vé riêng, có trò 100k chạy chưa được 3 phút. Xem đua heo, xiếc khỉ thì miễn phí, muốn đặt cược đua heo đua chó thì 20k một lượt. Vườn trái cây theo mùa — có khách đến đầu tháng 8 thì vườn không có trái. Nói thẳng: review mấy tuần gần đây chê khá nhiều về vệ sinh và thái độ nhân viên. Đi nhóm đông thì vui hơn đi lẻ.\n📍 Nhà cổ Bình Thủy (Bình Thủy) — Nơi quay bộ phim Người tình (L'Amant), ngoài kiểu Pháp trong kiểu Á Đông, gia đình họ Dương vẫn đang sống ở đây. Vé giờ là 30k — nhiều trang mạng vẫn ghi giá cũ 15-20k. Trưa nhà có nghỉ, các nguồn ghi giờ khác nhau từ 11h30 đến 14h, nên tránh đến khung giờ này. Mang máy ảnh vào chụp sẽ bị thu thêm, mức thu mỗi người nghe một kiểu nên hỏi giá trước. Bên trong không có người thuyết minh hay bảng chú thích, nên khá nhiều người thấy đứng ngoài cổng chụp là đủ. Ai mê phim hoặc thích đồ cổ thì vẫn nên vào.\n📍 Đền thờ Vua Hùng (Bình Thủy) — Khánh thành tháng 4/2022, gần sân bay Cần Thơ. Vào cửa miễn phí. Đền chính thiết kế theo hình trống đồng, quanh đền có 18 vòm cung tượng trưng 18 đời Vua Hùng và 54 cột đá cho 54 dân tộc. Sân rất rộng nhưng ít bóng cây, trưa khá nắng. Bảo vệ thường cho gửi xe ở ngoài, xe máy 5k, ô tô 20k. Ngày thường vắng, dịp lễ mới đông.\n📍 Cồn Sơn (Bình Thủy) — Cù lao du lịch cộng đồng giữa sông Hậu, đi đò từ bến Cô Bắc qua. Trên cồn có bè cá, xem cá lóc bay, massage cá, ăn trái cây tại vườn, tự tay làm bánh lá mít và cốm nổ với người dân. Lối vào bến khó tìm và ít chỗ đậu ô tô, nên đặt tour có hướng dẫn viên đón ở bến. Có khách kể hỏi vé 6 điểm 390k nhưng chỉ được dẫn 3 điểm mà vẫn tính 350k — nên hỏi rõ tour gồm những điểm nào trước khi trả tiền. Ra bè cá thì chọn tàu to, đi đò nhỏ trên sông lớn khá sợ. Trời nóng, đi buổi sáng dễ chịu hơn.\n💡 Tips du lịch:\n• Nhà cổ Bình Thủy, đền Vua Hùng và Cồn Sơn nằm gần nhau, ghép chung một buổi\n• Lò hủ tiếu Sáu Hoài ghép luôn với chợ nổi Cái Răng buổi sáng sớm\n• Nhà cổ nghỉ trưa, tránh đến khoảng 12h đến 14h\n• Từ 01/07/2025 Cần Thơ đã gộp thêm Sóc Trăng và Hậu Giang, bài này chỉ nói Cần Thơ cũ\nBạn sẽ bỏ 30k vào nhà cổ hay đứng ngoài cổng chụp là đủ?\n#cantho #dulichcantho #conson #nhacobinhthuy #mientay #kinhnghiemdulich", "dia_danh": "Cần Thơ | Lò hủ tiếu Sáu Hoài | Làng du lịch Mỹ Khánh | Nhà cổ Bình Thủy | Nhà cổ Bình Thủy | Đền thờ Vua Hùng | Cồn Sơn | Cồn Sơn | Cần Thơ", "phu_de": "Ngoài chợ nổi còn 5 điểm, có chỗ vào miễn phí\nChỗ nào đáng tiền, chỗ nào chụp ngoài là đủ | Từ chợ nổi Cái Răng đi đò 5 đến 10 phút là tới\nCó hủ tiếu ngũ sắc, màu xanh là từ lá dứa\nMón nên thử là pizza hủ tiếu chiên giòn | Vé cổng khoảng 150k, trò chơi mua vé riêng\nXem đua heo, xiếc khỉ miễn phí, đặt cược mất 20k\nVườn trái cây theo mùa, có lúc tới không có trái | Nơi quay phim Người tình, gia đình vẫn đang ở\nVé giờ là 30k, nhiều trang mạng còn ghi giá cũ\nTrưa có nghỉ, tránh đến khoảng 12h đến 14h | Mang máy ảnh vào chụp bị thu thêm, hỏi giá trước\nBên trong không có người thuyết minh\nNhiều người thấy chụp ngoài cổng là đủ | Vào cửa miễn phí, gửi xe ngoài 5k xe máy\nĐền hình trống đồng, 18 vòm cho 18 đời Vua Hùng\

<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xem trước carousel — Simo</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b1119;color:#e8eef4;
       font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
       -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:#0b1119f2;backdrop-filter:blur(10px);
         border-bottom:1px solid #1c2836;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .hrow{display:flex;align-items:center;gap:10px}
  select{flex:1;min-width:0;background:#16222f;color:#e8eef4;
         border:1px solid #233242;border-radius:9px;padding:9px 10px;font-size:14px;
         font-family:inherit;-webkit-appearance:none;appearance:none}
  h1{margin:9px 0 0;font-size:15px;font-weight:600;line-height:1.42;color:#cfe0ee}
  .meta{margin-top:5px;font-size:12px;color:#7f97ab}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;
       margin-right:5px;vertical-align:1px}

  /* ----- carousel: cuon ngang, snap tung tam - dung nhu vuot tren TikTok ----- */
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
        padding:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .slide{flex:0 0 auto;scroll-snap-align:center;position:relative}
  .slide img{display:block;width:min(78vw,340px);aspect-ratio:9/16;object-fit:cover;
             border-radius:14px;background:#131e2a;box-shadow:0 8px 28px #0006}
  .num{position:absolute;top:10px;left:10px;background:#0b1119cc;backdrop-filter:blur(4px);
       font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.4px}
  .num.cover{background:#b4832bdd}
  .num.cta{background:#12556fdd}

  .bar{display:flex;gap:5px;justify-content:center;padding:0 16px 14px}
  .bar i{height:3px;flex:1;max-width:34px;border-radius:2px;background:#243444;transition:background .2s}
  .bar i.on{background:#5fb3d4}

  .wrap{padding:0 16px 40px;max-width:680px;margin:0 auto}
  .card{background:#111c28;border:1px solid #1e2c3c;border-radius:13px;padding:14px;margin-bottom:14px}
  .card h2{margin:0 0 9px;font-size:13px;font-weight:700;color:#8fb0c8;
           text-transform:uppercase;letter-spacing:.7px}
  .cap{font-size:14px;line-height:1.62;white-space:pre-wrap;word-break:break-word;color:#dbe6f0}
  button{background:#12556f;color:#fff;border:0;border-radius:9px;padding:10px 15px;
         font-size:14px;font-weight:600;font-family:inherit;margin-top:11px}
  button:active{background:#0e4459}
  .pts{list-style:none;margin:0;padding:0;font-size:13.5px;line-height:1.5}
  .pts li{padding:8px 0;border-top:1px solid #1a2733;display:flex;gap:10px}
  .pts li:first-child{border-top:0}
  .pts b{color:#7f97ab;font-weight:600;flex:0 0 20px}
  .empty{color:#7f97ab;text-align:center;padding:70px 20px;line-height:1.7}
</style></head><body>

<header>
  <div class="hrow"><select id="pick" onchange="show(this.value)"></select></div>
  <h1 id="title">Đang tải…</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="rail" id="rail"></div>
<div class="bar" id="bar"></div>

<div class="wrap">
  <div class="card">
    <h2>Caption</h2>
    <div class="cap" id="cap"></div>
    <button onclick="copyCap()" id="cpbtn">Copy caption</button>
  </div>
  <div class="card">
    <h2>Chữ trên từng tấm</h2>
    <ul class="pts" id="pts"></ul>
  </div>
</div>

<script>
var DATA = [], cur = null;

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function show(slug){
  var p = DATA.find(function(x){ return x.slug === slug; });
  if(!p) return;
  cur = p;
  var _pk = document.getElementById('pick'); if(_pk) _pk.value = slug;
  document.getElementById('title').textContent = p.title || p.slug;

  var imgs = p.images || [];
  document.getElementById('meta').innerHTML =
    (p.posted ? '<span class="dot"></span>đã vào draft · ' : '') + imgs.length + ' tấm';

  // Cot 'dia_danh' trong manifest la ten tung tam noi bang '|' - tam 1 la bia,
  // tam cuoi la CTA, o giua moi la dia diem that.
  var names = String(p.dia_danh || '').split('|').map(function(s){ return s.trim(); });
  var subs  = String(p.phu_de   || '').split('|').map(function(s){ return s.trim(); });

  document.getElementById('rail').innerHTML = imgs.map(function(u, i){
    var kind = i === 0 ? 'cover' : (i === imgs.length - 1 ? 'cta' : '');
    var tag  = i === 0 ? 'BÌA' : (i === imgs.length - 1 ? 'CTA' : (i + 1));
    return '<div class="slide"><span class="num ' + kind + '">' + tag + '</span>' +
           '<img loading="lazy" src="' + esc(u) + '"></div>';
  }).join('');

  document.getElementById('bar').innerHTML =
    imgs.map(function(_, i){ return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join('');

  document.getElementById('cap').textContent = p.caption || '(không có caption)';

  document.getElementById('pts').innerHTML = imgs.map(function(_, i){
    var lines = (subs[i] || '').split('\n').filter(function(s){ return s.trim(); });
    return '<li><b>' + (i + 1) + '</b><span><strong>' + esc(names[i] || '—') + '</strong>' +
           (lines.length ? '<br>' + lines.map(esc).join('<br>') : '') + '</span></li>';
  }).join('');

  document.getElementById('rail').scrollLeft = 0;
}

// Cham sang tam nao thi to cham do - dung IntersectionObserver de khong phai
// tinh toan lai vi tri moi lan cuon.
var rail = document.getElementById('rail');
rail.addEventListener('scroll', function(){
  var slides = rail.querySelectorAll('.slide');
  if(!slides.length) return;
  var mid = rail.scrollLeft + rail.clientWidth / 2, best = 0, bd = 1e9;
  slides.forEach(function(s, i){
    var c = s.offsetLeft + s.offsetWidth / 2, d = Math.abs(c - mid);
    if(d < bd){ bd = d; best = i; }
  });
  var dots = document.getElementById('bar').children;
  for(var i = 0; i < dots.length; i++) dots[i].className = (i === best ? 'on' : '');
}, {passive:true});

function copyCap(){
  if(!cur) return;
  var b = document.getElementById('cpbtn');
  navigator.clipboard.writeText(cur.caption || '').then(function(){
    b.textContent = 'Đã copy ✓';
    setTimeout(function(){ b.textContent = 'Copy caption'; }, 1600);
  });
}

. Đường vào hẹp chỉ vừa một ô tô, xe ngược chiều không tránh được nên dễ ùn, tốt nhất đi xe máy. Đường xuống hồ trơn và đất đỏ, đừng mặc đồ trắng.\n📍 Động Ngườm Ngao (Đàm Thủy) — Ngườm là hang, Ngao là hổ: nước suối trong động chảy mạnh nghe như tiếng hổ gầm. Có hai tuyến: vé 45k đi khoảng 1km trong 30 đến 40 phút, còn tuyến trải nghiệm 195k đi sâu 2 tiếng có hướng dẫn viên, được phát mũ, đèn, giày lội nước. Rất nhiều review khuyên đi tuyến 195k vì vé 45k chỉ được chừng một phần ba động. Tuyến sâu phải lội suối nên mặc quần short. Trong động mát lạnh quanh năm.\n📍 Thác Bản Giốc (Đàm Thủy) — Thác nằm ngay trên biên giới, phía bên kia là Trung Quốc. Vé vào 40 đến 45k, đi thuyền ra chân thác 100k. Mẹo ít người biết: sau khối đá có cầu thang dẫn lên đỉnh tầng thác đầu tiên, có người thấy ngắm từ trên đó còn đẹp hơn đi thuyền. Chùa Phật Tích Trúc Lâm trên đồi cạnh thác vào miễn phí, leo cầu thang chừng 10 phút, đứng góc sân bên phải là thấy toàn cảnh thác. Dưới chân thác nước bắn ướt hết người, mang áo mưa và đi giày không trơn. Cuối tháng 9, đầu tháng 10 là lúc đẹp nhất vì vừa nhiều nước vừa có lúa chín vàng quanh thác.\n💡 Tips du lịch:\n• Hồ Thang Hen và núi Mắt Thần chỉ cách nhau khoảng 3km, ghép chung một buổi\n• Động Ngườm Ngao cách thác Bản Giốc khoảng 3km đường đi, ghép luôn trong buổi\n• Sau mưa bão nước thác đục, nên xem dự báo trước khi đi\n• Có dịch vụ cho thuê đồ dân tộc ngay ngoài cổng thác để chụp ảnh\nBạn sẽ đi thuyền ra chân thác hay leo lên tầng thác đầu tiên để ngắm?\n#caobang #thacbangioc #nuimatthan #dulichcaobang #kinhnghiemdulich", "dia_danh": "Cao Bằng | Đèo Mã Phục | Hồ Thang Hen | Núi Mắt Thần | Núi Mắt Thần | Động Ngườm Ngao | Thác Bản Giốc | Thác Bản Giốc | Cao Bằng", "phu_de": "5 điểm từ núi Mắt Thần tới thác Bản Giốc\nĐẹp nhất cuối tháng 9, đầu tháng 10 | Đèo 7 tầng dốc, cách thành phố 22km trên quốc lộ 3\nMã Phục nghĩa là ngựa quỳ, gắn với Nùng Trí Cao\nĐi xe khó thấy hết đèo, phải có flycam | Vé vào 30k, thuyền dạo hồ 300k cho 8 đến 9 người\nTháng 7, 8 nước xanh nhất, mùa đông hồ cạn\nNhiều người thấy bình thường, vội thì bỏ qua | Vào cửa miễn phí, có quán nước ở lối vào\nHồ dưới chân núi chỉ có vào mùa mưa\nĐi thuyền vòng hồ 100k, chuyến ngắn 50k | Đường vào chỉ vừa một ô tô, nên đi xe máy\nĐường xuống hồ trơn, đất đỏ, đừng mặc đồ trắng\nLễ 2/9 vẫn vắng, chưa bị du lịch hoá | Vé 45k đi 1km, 195k đi sâu 2 tiếng có hướng dẫn\nNhiều người khuyên đi 195k, vé 45k chỉ được 1/3 động\nTuyến sâu phải lội suối, mặc quần short đi | Vé vào 40 đến 45k, đi thuyền ra chân thác 100k\nThác nằm ngay biên giới, bên kia là Trung Quốc\nCuối tháng 9, đầu tháng 10 có thêm lúa chín vàng | Sau khối đá có cầu thang lên đỉnh tầng thác đầu\nChùa Trúc Lâm trên đồi cạnh thác, vào miễn phí\nDưới chân thác nước bắn ướt hết, mang áo mưa | Mỗi ngày 1 điểm đến Việt Nam\nTips thật từ review khách đi\nTheo dõi Simo để không bỏ lỡ", "posted": false}];

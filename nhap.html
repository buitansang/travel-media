<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xem trước carousel — Simo</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b1119;color:#e8eef4;
       font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
       -webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:#0b1119f2;backdrop-filter:blur(10px);
         border-bottom:1px solid #1c2836;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .hrow{display:flex;align-items:center;gap:10px}
  select{flex:1;min-width:0;background:#16222f;color:#e8eef4;
         border:1px solid #233242;border-radius:9px;padding:9px 10px;font-size:14px;
         font-family:inherit;-webkit-appearance:none;appearance:none}
  h1{margin:9px 0 0;font-size:15px;font-weight:600;line-height:1.42;color:#cfe0ee}
  .meta{margin-top:5px;font-size:12px;color:#7f97ab}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4ade80;
       margin-right:5px;vertical-align:1px}

  /* ----- carousel: cuon ngang, snap tung tam - dung nhu vuot tren TikTok ----- */
  .rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
        padding:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .slide{flex:0 0 auto;scroll-snap-align:center;position:relative}
  .slide img{display:block;width:min(78vw,340px);aspect-ratio:9/16;object-fit:cover;
             border-radius:14px;background:#131e2a;box-shadow:0 8px 28px #0006}
  .num{position:absolute;top:10px;left:10px;background:#0b1119cc;backdrop-filter:blur(4px);
       font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;letter-spacing:.4px}
  .num.cover{background:#b4832bdd}
  .num.cta{background:#12556fdd}

  .bar{display:flex;gap:5px;justify-content:center;padding:0 16px 14px}
  .bar i{height:3px;flex:1;max-width:34px;border-radius:2px;background:#243444;transition:background .2s}
  .bar i.on{background:#5fb3d4}

  .wrap{padding:0 16px 40px;max-width:680px;margin:0 auto}
  .card{background:#111c28;border:1px solid #1e2c3c;border-radius:13px;padding:14px;margin-bottom:14px}
  .card h2{margin:0 0 9px;font-size:13px;font-weight:700;color:#8fb0c8;
           text-transform:uppercase;letter-spacing:.7px}
  .cap{font-size:14px;line-height:1.62;white-space:pre-wrap;word-break:break-word;color:#dbe6f0}
  button{background:#12556f;color:#fff;border:0;border-radius:9px;padding:10px 15px;
         font-size:14px;font-weight:600;font-family:inherit;margin-top:11px}
  button:active{background:#0e4459}
  .pts{list-style:none;margin:0;padding:0;font-size:13.5px;line-height:1.5}
  .pts li{padding:8px 0;border-top:1px solid #1a2733;display:flex;gap:10px}
  .pts li:first-child{border-top:0}
  .pts b{color:#7f97ab;font-weight:600;flex:0 0 20px}
  .empty{color:#7f97ab;text-align:center;padding:70px 20px;line-height:1.7}
</style></head><body>

<header>
  <div class="hrow"><select id="pick" onchange="show(this.value)"></select></div>
  <h1 id="title">Đang tải…</h1>
  <div class="meta" id="meta"></div>
</header>

<div class="rail" id="rail"></div>
<div class="bar" id="bar"></div>

<div class="wrap">
  <div class="card">
    <h2>Caption</h2>
    <div class="cap" id="cap"></div>
    <button onclick="copyCap()" id="cpbtn">Copy caption</button>
  </div>
  <div class="card">
    <h2>Chữ trên từng tấm</h2>
    <ul class="pts" id="pts"></ul>
  </div>
</div>

<script>
var DATA = [], cur = null;

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function show(slug){
  var p = DATA.find(function(x){ return x.slug === slug; });
  if(!p) return;
  cur = p;
  var _pk = document.getElementById('pick'); if(_pk) _pk.value = slug;
  document.getElementById('title').textContent = p.title || p.slug;

  var imgs = p.images || [];
  document.getElementById('meta').innerHTML =
    (p.posted ? '<span class="dot"></span>đã vào draft · ' : '') + imgs.length + ' tấm';

  // Cot 'dia_danh' trong manifest la ten tung tam noi bang '|' - tam 1 la bia,
  // tam cuoi la CTA, o giua moi la dia diem that.
  var names = String(p.dia_danh || '').split('|').map(function(s){ return s.trim(); });
  var subs  = String(p.phu_de   || '').split('|').map(function(s){ return s.trim(); });

  document.getElementById('rail').innerHTML = imgs.map(function(u, i){
    var kind = i === 0 ? 'cover' : (i === imgs.length - 1 ? 'cta' : '');
    var tag  = i === 0 ? 'BÌA' : (i === imgs.length - 1 ? 'CTA' : (i + 1));
    return '<div class="slide"><span class="num ' + kind + '">' + tag + '</span>' +
           '<img loading="lazy" src="' + esc(u) + '"></div>';
  }).join('');

  document.getElementById('bar').innerHTML =
    imgs.map(function(_, i){ return '<i' + (i === 0 ? ' class="on"' : '') + '></i>'; }).join('');

  document.getElementById('cap').textContent = p.caption || '(không có caption)';

  document.getElementById('pts').innerHTML = imgs.map(function(_, i){
    var lines = (subs[i] || '').split('\n').filter(function(s){ return s.trim(); });
    return '<li><b>' + (i + 1) + '</b><span><strong>' + esc(names[i] || '—') + '</strong>' +
           (lines.length ? '<br>' + lines.map(esc).join('<br>') : '') + '</span></li>';
  }).join('');

  document.getElementById('rail').scrollLeft = 0;
}

// Cham sang tam nao thi to cham do - dung IntersectionObserver de khong phai
// tinh toan lai vi tri moi lan cuon.
var rail = document.getElementById('rail');
rail.addEventListener('scroll', function(){
  var slides = rail.querySelectorAll('.slide');
  if(!slides.length) return;
  var mid = rail.scrollLeft + rail.clientWidth / 2, best = 0, bd = 1e9;
  slides.forEach(function(s, i){
    var c = s.offsetLeft + s.offsetWidth / 2, d = Math.abs(c - mid);
    if(d < bd){ bd = d; best = i; }
  });
  var dots = document.getElementById('bar').children;
  for(var i = 0; i < dots.length; i++) dots[i].className = (i === best ? 'on' : '');
}, {passive:true});

function copyCap(){
  if(!cur) return;
  var b = document.getElementById('cpbtn');
  navigator.clipboard.writeText(cur.caption || '').then(function(){
    b.textContent = 'Đã copy ✓';
    setTimeout(function(){ b.textContent = 'Copy caption'; }, 1600);
  });
}

DATA = [{"slug": "ha-noi-bao-tang", "title": "Hà Nội chơi gì phần 3: 7 bảo tàng và 1 cái đang đóng cửa", "images": ["https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/1.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/2.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/3.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/4.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/5.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/6.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/7.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/8.jpg?v=1", "https://buitansang.github.io/travel-media/nhap/ha-noi-bao-tang/9.jpg?v=1"], "caption": "Hà Nội chơi gì phần 3: 7 bảo tàng và 1 cái đang đóng cửa\n\nHà Nội có cả chục bảo tàng nhưng ít người biết cái nào đáng vé. Đây là bảy cái đang mở, kèm giá vé lấy từ trang chính thức và review khách đi trong vòng một tháng.\n📍 Bảo tàng Dân tộc học Việt Nam (Cầu Giấy) — Vé 40.000đ, sinh viên 20.000đ, học sinh 10.000đ, trẻ dưới 6 tuổi miễn phí. Mở 8h30 đến 17h30, nghỉ thứ Hai. Điểm mạnh nhất không nằm trong nhà mà ở khu ngoài trời: nhà sàn, nhà rông, nhà mồ của các dân tộc được dựng thật và vào được bên trong. Một khoản dễ bị bất ngờ: bảng giá chính thức tính riêng phí chụp ảnh, 50.000đ cho máy du lịch và 500.000đ cho máy chuyên nghiệp. Chụp bằng điện thoại thì không nằm trong bảng này. Thuyết minh cũng tính riêng, 50.000đ đến 100.000đ tùy khu và tùy tiếng.\n📍 Bảo tàng Lịch sử Quân sự Việt Nam (Xuân Phương) — Vé 40.000đ theo Thông tư 90/2025 của Bộ Tài chính. Giảm 50% cho học sinh 16 đến 18 tuổi, sinh viên, người cao tuổi 60 đến 80, người khuyết tật nặng. Miễn phí cho cựu chiến binh, người có công, người từ 80 tuổi trở lên. Mới dời từ nội thành ra nên khuôn viên rất rộng, xe tăng và máy bay trưng bày ngoài trời. Đây là bảo tàng hot nhất Hà Nội hiện nay.\n📍 Bảo tàng Hà Nội (Từ Liêm) — Vé 50.000đ, học sinh và sinh viên 25.000đ, miễn phí trẻ dưới 16 tuổi. Nhiều khách cho biết các dịp lễ lớn bảo tàng mở cửa miễn phí. Toà nhà bốn tầng với kiến trúc rất lạ, bên trong hơn 7.000 hiện vật và có khu workshop ở tầng một. Điều hòa mát, khuôn viên ngoài trời nhiều cây xanh.\n📍 Bảo tàng Mỹ thuật Việt Nam (Ba Đình) — Vé 40.000đ, học sinh sinh viên 20.000đ, trẻ 6 đến 16 tuổi 10.000đ. Mở 8h30 đến 17h từ thứ Ba đến Chủ nhật, nghỉ thứ Hai. Mạnh nhất là tranh sơn mài và tranh lụa, có người khuyên dành nửa ngày mới xem hết. Nói thật một điều: vài khách gần đây phàn nàn nhân viên nói chuyện to trong phòng tranh, và hệ thống chiếu sáng chưa tôn được hiện vật.\n📍 Bảo tàng Phụ nữ Việt Nam (Cửa Nam) — 36 Lý Thường Kiệt, ngay trung tâm. Đây là bảo tàng duy nhất trong bài mở cửa cả bảy ngày, 8h đến 17h, kể cả thứ Hai khi các nơi khác đều nghỉ. Ba khách độc lập đều nói cần 1,5 đến 2 tiếng mới xem hết. Điều hòa mát và nhiều khu có chỗ ngồi nghỉ. Phần về phụ nữ trong chiến tranh được nhiều người nhắc là cảm động nhất. Lưu ý khu nghệ thuật ở tầng trên cùng có khách báo đang đóng.\n📍 Bảo tàng Gốm Bát Tràng (Gia Lâm) — Vé 60.000đ nhưng đây chỉ là gói cơ bản, và nhiều khách thấy hụt: một người viết mua vé 60k mà tầng một chỉ có vài quầy hàng, tầng bốn là nhà hàng. Muốn trải nghiệm đủ thì phải mua combo cao hơn, có bao gồm nặn gốm. Nặn xong muốn mang sản phẩm về còn phải trả thêm khoảng 100.000đ chưa kể phí ship, và đợi hai đến ba tuần. Thứ được khen nhất lại là khu nghệ thuật ánh sáng ở tầng 3 và tầng 5.\n📍 Bảo tàng Phòng không - Không quân (Phương Liệt) — Giá vé em không dám ghi vì hai nguồn vênh nhau, một bên nói 10.000đ, một bên nói 15.000đ cho người Việt và 30.000đ cho người nước ngoài, mà bảo tàng không có trang chính thức để đối chiếu. Thuê hướng dẫn viên thì chắc hơn: 80.000đ một đoàn. Phần lớn hiện vật nằm ngoài trời gồm máy bay MiG, xe tăng và bệ tên lửa phòng không, nên đi sáng sớm cho mát.\n💡 Tips du lịch:\n• Mỹ thuật và Phụ nữ cách nhau 1,7km, ghép chung một buổi được\n• Lịch sử Quân sự và Bảo tàng Hà Nội cách nhau 3,2km, cũng đi chung được\n• Gốm Bát Tràng xa nhất, cách Lịch sử Quân sự gần 17km, phải tách buổi riêng\n• Trừ Bảo tàng Phụ nữ, hầu hết các bảo tàng nghỉ thứ Hai, nhớ tránh ngày này\n• Bảo tàng Lịch sử Quốc gia ở số 1 Tràng Tiền đang sửa chữa, sáu khách từ bốn tháng trước tới tuần trước đều báo đóng cửa, đừng tới\nBạn sẽ chọn bảo tàng nào đầu tiên?\n#hanoi #baotanghanoi #hanoididau #baotangdantochoc #kinhnghiemdulich", "dia_danh": "Hà Nội | Bảo tàng Dân tộc học | Bảo tàng Lịch sử Quân sự | Bảo tàng Hà Nội | Bảo tàng Mỹ thuật Việt Nam | Bảo tàng Phụ nữ Việt Nam | Bảo tàng Gốm Bát Tràng | Bảo tàng Phòng không Không quân | Hà Nội", "phu_de": "Bảy bảo tàng, vé phổ biến từ 40k đến 60k\nCái thứ tám đang đóng cửa sửa, đừng đi phí | Vé 40k, sinh viên 20k, học sinh 10k\nKhu nhà dân tộc dựng thật, vào được bên trong\nMang máy ảnh rời vào phải trả thêm 50k | Vé 40k theo Thông tư 90/2025, sinh viên giảm nửa\nXe tăng và máy bay trưng bày ngoài trời\nCựu chiến binh và người từ 80 tuổi được miễn vé | Vé 50k, học sinh sinh viên 25k\nBốn tầng, hơn 7.000 hiện vật, có workshop tầng 1\nDịp lễ lớn thường miễn phí vé vào | Vé 40k, mở 8h30 đến 17h, nghỉ thứ Hai\nMạnh nhất là tranh sơn mài và tranh lụa\nCó khách chê nhân viên nói chuyện ồn | Mở 8h đến 17h cả thứ Hai, khác các bảo tàng kia\nNên dành 1,5 đến 2 tiếng mới xem hết\nĐiều hòa mát, nhiều khu có chỗ ngồi nghỉ | Vé 60k là gói cơ bản, nhiều người thấy hụt\nNặn gốm xong mang về thêm 100k, đợi 2-3 tuần\nĐẹp nhất là nghệ thuật ánh sáng tầng 3 và 5 | Máy bay MiG, xe tăng và bệ tên lửa ngoài trời\nThuê hướng dẫn viên 80k một đoàn\nPhần lớn ngoài trời, nên đi sáng sớm cho mát | Mỗi ngày 1 điểm đến Việt Nam\nTips thật từ review khách đi\nTheo dõi Simo để không bỏ lỡ", "posted": true}, {"slug": "ha-noi-p2", "title": "Hà Nội chơi gì phần 2: 7 điểm, ba nơi vào cửa miễn phí", "images": ["https://buitansang.github.io/travel-media/nhap/ha-noi-p2/1.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/2.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/3.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/4.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/5.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/6.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/7.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/8.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/ha-noi-p2/9.jpg?v=2"], "caption": "Hà Nội chơi gì phần 2: 7 điểm, ba nơi vào cửa miễn phí\n\nPhần 1 đã làm năm điểm kinh điển. Đây là bảy điểm tiếp theo, tất cả tips lấy từ review khách đi trong vòng một tuần tới một tháng.\n📍 Nhà thờ Lớn Hà Nội (Hoàn Kiếm) — Vào cửa miễn phí. Nhà thờ Công giáo cổ nhất Hà Nội, người Pháp xây thập niên 1880, kiến trúc Gothic được nói là lấy cảm hứng từ Nhà thờ Đức Bà Paris. Một mẹo nhỏ mà nhiều người không biết: lối vào nằm phía bên trái, khách hay đi nhầm sang bên phải rồi được người trông coi hướng sang. Không phải lúc nào bên trong cũng mở, có người đi Chủ nhật không vào được, nên hỏi giờ lễ trước. Mùa thu ngồi trước cửa ăn xôi cốm uống trà chanh là đúng bài. Nói thật một điều: bãi giữ xe quanh đây bị khách chê phí cao và nhân viên thái độ.\n📍 Nhà hát Múa rối Thăng Long (Hoàn Kiếm) — 57B Đinh Tiên Hoàng, ngay cạnh hồ Gươm. Buổi diễn khoảng 45 đến 50 phút. Vé bán hết rất nhanh nên nên đặt trước ít nhất một ngày, chỗ ngồi tốt hết trước tiên. Khoản mà ai cũng bất ngờ: tai nghe thuyết minh phải thuê thêm và tính riêng, nhiều khách nói không được báo lúc mua vé, trong khi toàn bộ vở diễn bằng tiếng Việt nên khách nước ngoài gần như phải thuê. Khán phòng khá ồn, nhiều trẻ nhỏ, có khách than bị giật ghế từ phía sau.\n📍 Café Giảng (Hoàn Kiếm) — 39 Nguyễn Hữu Huân, nơi được nhiều người gọi là chỗ khai sinh cà phê trứng. Một ly khoảng 45k đến 50k. Ba điều nên biết trước khi tới: quán chỉ nhận tiền mặt, không quẹt thẻ; quán chật và rất đông, ngồi lâu không thoải mái; và không có nước lọc miễn phí, muốn uống nước phải gọi thêm. Vị thì chia hai phe, nhiều người khen ngon nhất chuyến đi, vài người thấy chỉ ở mức trung bình.\n📍 Đền Quán Thánh (Ba Đình) — Vé 10.000đ, rẻ nhất cả bài. Là một trong Thăng Long tứ trấn, trấn giữ phương Bắc, nổi bật với tượng đồng đen Huyền Thiên Trấn Vũ. Đền nằm ngay ngã tư Thanh Niên, rợp bóng cây và hướng ra hồ Tây, nên ghép chung buổi với chùa Trấn Quốc ở phần 1 là tiện nhất. Đền không lớn, xem khoảng nửa tiếng là hết.\n📍 Phủ Tây Hồ (Tây Hồ) — Vào cửa miễn phí, nằm trên bán đảo nhô ra giữa hồ Tây. Đây là chỗ dễ hụt nhất: mùng 1 và ngày rằm đông tới mức chen không nổi, một khách đi thường xuyên kể đúng mùng 1 thì mâm lễ phải để sát đất vì không còn chỗ. Đi ngày thường mới có không gian ngắm kiến trúc phủ và mặt hồ. Ai ngại sắm lễ thì ngoài cổng có bán mâm sắp sẵn, giá từ 190k trở lên.\n📍 Cầu Long Biên (Hồng Hà) — Miễn phí, đi bộ lên được trở lại từ 0h ngày 28/5/2026 sau hai tháng sửa chữa. Đính chính một lời đồn rất phổ biến: cầu KHÔNG phải do Gustave Eiffel thiết kế. Nhà thầu là Daydé & Pillé của Paris; Eiffel đã rời công ty của chính mình từ tháng 2/1893, công ty cũ của ông có dự thầu nhưng trượt. Tên gốc của cầu là cầu Doumer. Cầu chính dài 2.290m cộng 896m cầu dẫn, 19 nhịp trên 20 trụ. Trong chiến tranh bị ném bom 10 lần giai đoạn 1965 đến 1968, thêm 4 lần nữa năm 1972. Lưu ý cầu đã đóng hai lần trong 12 tháng qua nên kiểm lại trước khi đi xa.\n📍 Đài quan sát LOTTE Hanoi Sky (Giảng Võ) — Sàn kính nhìn toàn thành phố 360 độ từ tầng 65. Mẹo quan trọng nhất: lối vào nằm ở tầng hầm Lotte Mart chứ không phải sảnh khách sạn, không biết thì đi lòng vòng tìm mãi. Đi ngày thường rất vắng, có khách kể vắng tới mức được đi thang máy một mình. Trên đài có quán cà phê và quầy bar.\n💡 Tips du lịch:\n• Nhà thờ Lớn, Múa rối, Café Giảng và cầu Long Biên nằm sát nhau, cách nhau 230m đến hơn 1km, đi bộ hết một buổi được\n• Quán Thánh cách Nhà thờ Lớn 2km, ghép chung với chùa Trấn Quốc ở phần 1\n• Phủ Tây Hồ và LOTTE Sky xa hơn, cách cụm trung tâm hơn 4km, nên tách buổi riêng\n• Ba nơi vào cửa miễn phí: Nhà thờ Lớn, Phủ Tây Hồ, cầu Long Biên\n• Vào đền chùa nhớ mặc kín đáo, tránh giờ đang có lễ\nBạn sẽ đi bộ lên cầu Long Biên hay lên tầng 65 ngắm cả Hà Nội?\n#hanoi #hanoididau #thuhanoi #caulongbien #cafetrung #kinhnghiemdulich", "dia_danh": "Hà Nội | Nhà thờ Lớn Hà Nội | Múa rối nước Thăng Long | Café Giảng | Đền Quán Thánh | Phủ Tây Hồ | Cầu Long Biên | Đài quan sát LOTTE Hanoi Sky | Hà Nội", "phu_de": "7 điểm ngoài nhóm kinh điển ở phần 1\nBa nơi miễn phí, vé rẻ nhất chỉ 10k | Vào cửa miễn phí, lối vào nằm bên trái\nBãi giữ xe quanh đó bị chê chặt chém\nMùa thu ngồi trước cửa ăn xôi cốm, uống trà chanh | Buổi diễn khoảng 45 đến 50 phút\nTai nghe thuyết minh phải thuê thêm, tính riêng\nVé hết nhanh, nên đặt trước ít nhất một ngày | Cà phê trứng 45k đến 50k, chỉ nhận tiền mặt\nQuán chật và rất đông, ngồi lâu không thoải mái\nKhông có nước lọc miễn phí, muốn thì phải gọi | Vé 10k, rẻ nhất trong bài\nMột trong Thăng Long tứ trấn, có tượng đồng đen\nNgay ngã tư Thanh Niên, đi cùng chùa Trấn Quốc | Mùng 1 và rằm đông tới mức chen không nổi\nMâm lễ sắp sẵn bán từ 190k trở lên\nĐi ngày thường mới có chỗ ngắm phủ và hồ | Không phải Eiffel thiết kế như nhiều người tưởng\nThông xe lại cho người đi bộ từ 28/5/2026\nDài 2.290m, riêng 1965-1968 bị ném bom 10 lần | Lối vào ở tầng hầm Lotte Mart, không phải sảnh\nSàn kính nhìn toàn thành phố từ tầng 65\nNgày thường vắng tới mức thang máy chỉ có mình bạn | Mỗi ngày 1 điểm đến Việt Nam\nTips thật từ review khách đi\nTheo dõi Simo để không bỏ lỡ", "posted": true}, {"slug": "ha-noi-p1", "title": "Thu Hà Nội chơi gì: 5 điểm kinh điển, vé từ 0 đến 100k", "images": ["https://buitansang.github.io/travel-media/nhap/ha-noi-p1/1.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/2.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/3.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/4.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/5.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/6.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/7.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/8.jpg?v=4", "https://buitansang.github.io/travel-media/nhap/ha-noi-p1/9.jpg?v=4"], "caption": "Thu Hà Nội chơi gì: 5 điểm kinh điển, vé từ 0 đến 100k\n\nNăm điểm ai cũng biết tên, nhưng giá vé và giờ mở cửa thì mỗi nơi một kiểu. Tất cả tips dưới đây lấy từ review khách đi trong vòng một tuần tới một tháng.\n📍 Hoàng thành Thăng Long (Ba Đình) — Vé 100k, áp dụng từ 01/01/2025 theo trang chính thức, trước đó là 70k nên nhiều trang mạng còn ghi giá cũ. Trẻ dưới 16 tuổi miễn phí, sinh viên có thẻ còn 50k, gửi xe 10k. Được UNESCO công nhận Di sản Văn hóa Thế giới năm 2010, lịch sử liên tục hơn 13 thế kỷ. Xuống được hầm chỉ huy ngầm dưới lòng đất. Có tour đêm \"Giải mã Hoàng thành Thăng Long\", vé riêng chứ không nằm trong vé ngày, khởi hành 19h tối thứ Sáu và thứ Bảy hằng tuần, kéo dài khoảng 1,5 tiếng. Trang chính thức ghi 300k một người lớn, trẻ dưới 12 tuổi giảm nửa và dưới 5 tuổi miễn phí, nhưng trang đó cập nhật từ 2022 nên nên gọi hỏi lại trước khi đi. Nhưng phải nói trước: nhiều khách tháng vừa rồi cho biết khu trưng bày đang tu sửa, một số phòng đóng cửa, có người thấy vé 100k hơi phí. Hỏi trước khi đi xa.\n📍 Văn Miếu – Quốc Tử Giám (Đống Đa) — Vé 70k theo trang chính thức vanmieu.gov.vn, có khách xác nhận đúng giá này tháng 9/2026. Học sinh sinh viên, người từ 60 tuổi và người khuyết tật nặng còn 35k; trẻ dưới 16 tuổi miễn phí. Xây năm 1070, là nơi đặt trường đại học quốc gia đầu tiên của Việt Nam. Xem hết trong 1 đến 2 tiếng, đi sáng sớm thì vắng và dễ chụp hơn. Đây cũng là nơi có nhiều góc hợp chụp ảnh áo dài. Ngoài vé ngày còn có tour đêm riêng, mở tối thứ Tư, thứ Bảy và Chủ nhật.\n📍 Đền Ngọc Sơn (Hoàn Kiếm) — Vé 50k người lớn, 25k cho trẻ em và người cao tuổi. Đền nằm trên đảo Ngọc giữa hồ Hoàn Kiếm, phải đi qua Tháp Bút, Đài Nghiên rồi bước qua cầu Thê Húc đỏ mới vào được. Một lưu ý rất lạ: ghim định vị của đền trên Google Maps hiện đang bị đổi thành tên một tiệm bánh, có khách đặt định vị xong đi lạc. Tìm theo \"cầu Thê Húc\" cho chắc.\n📍 Chùa Trấn Quốc (Tây Hồ) — Vào cửa miễn phí, và là ngôi chùa nhiều đánh giá nhất Hà Nội với hơn 47 nghìn lượt. Nhưng đây là chỗ nhiều người hụt nhất: chùa nghỉ trưa, chỉ mở khoảng 7h đến 11h30 và 13h30 đến 17h, trong khi Google hiển thị không đúng khung giờ này. Có khách phải ngồi đợi 2 tiếng, có người tới sau 11h30 thì hôm đó không vào được nữa. Chùa cũng rất đông khách đoàn, nhiều người khuyên đi giữa tuần cho vắng.\n📍 Di tích Nhà tù Hỏa Lò (Hoàn Kiếm) — Vé 50k. Thuê máy thuyết minh tự động thêm 100k, và đây là khoản đáng tiền nhất bài: rất nhiều khách nói nhờ nó mới hiểu được câu chuyện của những người từng bị giam. Theo trang chính thức hoalo.vn, di tích mở 8h đến 17h tất cả các ngày trong tuần, kể cả lễ Tết. Hiện vật gần như đều trưng bày trong nhà nên đi hôm mưa vẫn ổn, có khách kể hôm mưa to bảo tàng còn phát ô cho khách đi lại. Nói thật một điều: vài khách gần đây phàn nàn thái độ của một số nhân viên soát vé chưa tốt.\n💡 Tips du lịch:\n• Ba nơi có người đứng ngoài cổng bán khăn che chân cho khách mặc quần đùi, Trấn Quốc hét tới 250k, Ngọc Sơn 150k. Họ không phải người của chùa, nhiều khách mặc quần đùi vẫn vào thẳng bình thường\n• Muốn chắc thì mang sẵn quần dài qua gối và áo che vai, khỏi phải mua gì\n• Hỏa Lò, Ngọc Sơn và Văn Miếu đều ở trung tâm, cách nhau chưa tới 2km, đi chung một buổi được\n• Trấn Quốc xa hơn, cách cụm kia khoảng 2,5km, canh khung giờ chiều sau 13h30\n• Trấn Quốc nghỉ trưa, Hỏa Lò mở cả tuần kể cả lễ Tết; riêng Hoàng thành có khách nói đóng thứ Hai nên hỏi trước\nBạn sẽ đi Hỏa Lò nghe thuyết minh hay ra hồ Gươm qua cầu Thê Húc?\n#hanoi #hanoididau #thuhanoi #hoalo #hoangthanhthanglong #kinhnghiemdulich", "dia_danh": "Hà Nội | Hoàng thành Thăng Long | Hoàng thành Thăng Long | Văn Miếu – Quốc Tử Giám | Đền Ngọc Sơn | Chùa Trấn Quốc | Di tích Nhà tù Hỏa Lò | Di tích Nhà tù Hỏa Lò | Hà Nội", "phu_de": "5 điểm kinh điển, vé từ miễn phí tới 100k\nGiá vé tháng 9/2026, lấy từ review khách vừa đi | Vé 100k, trẻ dưới 16 tuổi miễn phí\nSinh viên có thẻ còn 50k, gửi xe 10k\nĐang tu sửa, nhiều khu trưng bày đóng cửa | Tour đêm tên là Giải mã Hoàng thành Thăng Long\nKhởi hành 19h tối thứ Sáu và thứ Bảy hằng tuần\nKéo dài khoảng 1,5 tiếng và giá khoảng 300k/người lớn | Vé 70k, học sinh sinh viên và người 60+ còn 35k\nĐi sáng sớm đỡ đông, xem hết 1 đến 2 tiếng\nNhiều góc hợp chụp ảnh áo dài | Vé 50k người lớn, 25k trẻ em và người già\nĐịnh vị Maps đang chỉ sai sang một tiệm bánh\nQua cầu Thê Húc đỏ mới vào được đền | Miễn phí, nhưng nghỉ trưa 11h30 đến 13h30\nĐông khách tour, nên đi giữa tuần cho vắng\nKhăn che chân bán 250k, nhiều khách vào thẳng vẫn được | Vé 50k, thuê máy thuyết minh thêm 100k\nNhiều khách nói máy thuyết minh rất đáng tiền\nMở 8h đến 17h tất cả các ngày, kể cả lễ Tết | Hiện vật trưng bày trong nhà, đi hôm mưa vẫn ổn\nMưa to bảo tàng có phát ô cho khách\nCó khách chê vài nhân viên thái độ chưa tốt | Mỗi ngày 1 điểm đến Việt Nam\nTips thật từ review khách đi\nTheo dõi Simo để không bỏ lỡ", "posted": true}, {"slug": "ninhbinh-p3", "title": "Ninh Bình chơi gì phần 3: 5 nhà thờ, 2 vương cung thánh đường", "images": ["https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/1.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/2.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/3.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/4.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/5.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/6.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/7.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/8.jpg?v=3", "https://buitansang.github.io/travel-media/nhap/ninhbinh-p3/9.jpg?v=3"], "caption": "Ninh Bình chơi gì phần 3: 5 nhà thờ, 2 vương cung thánh đường\n\nCả nước chỉ có 4 vương cung thánh đường. Sau sáp nhập, riêng Ninh Bình giữ 2 trong số đó — Phú Nhai của Nam Định cũ và Sở Kiện của Hà Nam cũ.\n📍 Vương cung thánh đường Phú Nhai (xã Xuân Hưng) — Một trong bốn vương cung thánh đường Việt Nam, cùng Sở Kiện, La Vang và Đức Bà Sài Gòn. Gothic Pháp với mái vòm nhọn và ô kính hoa hồng, dài 80m, rộng 27m, cao 30m, hai tháp chuông cao 44m treo 4 quả chuông đúc từ Pháp nặng 2.000kg, 1.200kg, 600kg và 100kg. Nhà thờ đang đứng đã là ngôi thứ tư: ngôi đầu là nhà thờ gỗ dựng năm 1866, ngôi thứ hai năm 1881, ngôi thứ ba xây năm 1916 rồi bị bão phá hỏng nặng ngày 24/6/1929; công trình hiện nay cung hiến ngày 7/12/1933. Ngày 12/8/2008 được nâng lên hàng tiểu vương cung thánh đường. Ngày 8/12 là lễ Đức Mẹ Vô nhiễm Nguyên tội, quan thầy đệ nhất của cả giáo phận Bùi Chu, khách hành hương về rất đông. Vào tham quan miễn phí.\n📍 Vương cung thánh đường Sở Kiện (phường Châu Sơn) — Còn gọi là nhà thờ Kẻ Sở, khởi công 25/10/1877 và khánh thành tháng 1/1883 dưới thời Giám mục Puginier Phước. Từng là nhà thờ chính tòa của Tổng giáo phận Hà Nội từ 1882 đến 1936. Dài 67,2m, rộng 31,2m, cao 23,2m, chứa được bốn đến năm nghìn người. Chi tiết ít ai để ý: nhà thờ xây trên một cái đầm nên phần nền phải lót nhiều lớp phiến gỗ lim dày xếp đan nhau để chống lún. Được nâng lên hàng tiểu vương cung thánh đường ngày 24/6/2010. Hiện đang sửa chữa, nhiều khách tháng 8 và tháng 9 năm nay cho biết có khu vực chưa vào được, nên hỏi trước khi đi xa.\n📍 Nhà thờ chính tòa Bùi Chu (xã Xuân Trường) — Điểm dễ hụt hẫng nhất nếu chỉ xem ảnh trên mạng. Nhà thờ cũ khánh thành năm 1885, sau vụ tranh cãi về bảo tồn năm 2019 đã được hạ giải giữa tháng 7/2020. Nhà thờ mới nhìn bên ngoài gần như giữ nguyên hình dáng và kiến trúc cũ, chỉ lớn hơn khoảng 10%: dài 72,5m, rộng 18m, cao 18,2m. Nhưng bên trong đổi hẳn — nội thất Baroque 18 cột của nhà thờ cũ được thay bằng khung gỗ 24 cột lim theo lối truyền thống Việt, nên ảnh cũ trên mạng không còn tả đúng nơi này nữa. Và đây là thời điểm đặc biệt: theo trang giáo phận Bùi Chu, ngày 25/9/2026 nhà thờ mới được khánh thành và cung hiến. Giáo xứ Bùi Chu lập năm 1670, còn vùng đất này được ghi nhận đón Tin Mừng từ năm 1533.\n📍 Nhà thờ Hưng Nghĩa (xã Hải Hưng) — Gothic tông đen xám rất lạ, nhiều người ví như một tiểu lâu đài châu Âu mọc giữa vùng quê ven biển Hải Hậu cũ. Nhà thờ gỗ đầu tiên khởi công năm 1927; công trình hiện nay khởi công 22/8/2001, hoàn thành cơ bản năm 2007 và khánh thành ngày 28/2/2012. Dài 76m, rộng 33m, cao 24m, hai tháp chuông cao tới 60m — cao hơn cả Phú Nhai lẫn Kiên Lao. Năm 2010 nhận sắc Đền Thánh, dâng kính Thánh Tâm Chúa Giêsu. Ban quản lý mở cửa cho khách tham quan tự do, có bãi đỗ xe rộng ngay đối diện. Nói thật một điều: có khách thấy công trình đồ sộ nhưng chi tiết chưa tinh xảo bằng kỳ vọng, và màu sơn đen bên ngoài đôi chỗ loang lổ.\n📍 Đền Thánh Kiên Lao (xã Xuân Trường) — Khởi công ngày 1/8/1994, hoàn thành 28/12/1997 đúng lễ Thánh Gia và được dâng kính Thánh Gia Thất. Dài 75m, rộng 26m, cao 28m, tháp chuông vươn tới 46m — cao hơn tháp chuông Phú Nhai. Kiến trúc pha trộn Á và Âu với hoa văn đắp nổi cầu kỳ, được ví như một tòa lâu đài cổ tích giữa miền quê Bắc Bộ. Có khách đi cách đây hai năm cho biết đường vào khá nhỏ, phải qua một cây cầu hẹp và đi ngang chợ, xe lớn nên cân nhắc.\n💡 Tips du lịch:\n• Phú Nhai, Bùi Chu và Kiên Lao cùng huyện Xuân Trường cũ, cách nhau khoảng 4km\n• Hưng Nghĩa cách cụm này khoảng 8 đến 12km\n• Sở Kiện xa hơn hẳn, hơn 50km về phía Hà Nam cũ, nên tách thành một buổi riêng\n• Vào nhà thờ nhớ mặc kín đáo, tránh giờ đang có thánh lễ\n• Từ 01/07/2025 Hà Nam và Nam Định đã nhập vào Ninh Bình, Maps đã đổi tên tỉnh\nBạn sẽ đi Phú Nhai hay canh ngày 25/9 để xem Bùi Chu cung hiến?\n#ninhbinh #namdinh #hanam #phunhai #buichu #kinhnghiemdulich", "dia_danh": "Ninh Bình | VCTĐ Phú Nhai | VCTĐ Phú Nhai | VCTĐ Sở Kiện | Nhà thờ chính tòa Bùi Chu | Nhà thờ chính tòa Bùi Chu | Nhà thờ Hưng Nghĩa | Đền Thánh Kiên Lao | Ninh Bình", "phu_de": "Ninh Bình giữ 2 trong 4 vương cung thánh đường cả nước\nNam Định và Hà Nam cũ, giờ chung một tỉnh | Một trong bốn vương cung thánh đường Việt Nam\nGothic Pháp, dài 80m, hai tháp chuông cao 44m\nĐược nâng lên hàng vương cung thánh đường năm 2008 | Nhà thờ hiện nay là ngôi thứ tư, ngôi đầu năm 1866\nBão phá ngôi cũ năm 1929, xây lại xong năm 1933\nNgày 8/12 lễ Đức Mẹ, khách hành hương về rất đông | Xây 1877, khánh thành 1883, từng là nhà thờ chính tòa\nXây trên đầm, nền lót nhiều lớp gỗ lim chống lún\nĐang sửa chữa, có khu vực chưa vào được | Nhà thờ cũ 1885 đã hạ giải tháng 7/2020\nBên ngoài giống nhà thờ cũ, lớn hơn khoảng 10%\nDài 72,5m, rộng 18m, cao 18,2m | Khánh thành và cung hiến ngày 25/9/2026\nBên trong đổi hẳn, khung gỗ thay lối Baroque cũ\nẢnh nhà thờ cổ trên mạng giờ không còn đúng | Gothic tông đen xám, nhiều người ví như châu Âu\nHai tháp chuông cao 60m, khánh thành năm 2012\nCó khách chê màu sơn đen đôi chỗ loang lổ | Xây từ 1994, hoàn thành cuối năm 1997\nTháp cao 46m, cao hơn tháp chuông Phú Nhai\nTượng đắp nổi cầu kỳ, ví như lâu đài cổ tích | Mỗi ngày 1 điểm đến Việt Nam\nTips thật từ review khách đi\nTheo dõi Simo để không bỏ lỡ", "posted": true}, {"slug": "can-tho-p2", "title": "Cần Thơ chơi gì phần 2: 5 điểm ngoài chợ nổi, chỗ nào đáng tiền", "images": ["https://buitansang.github.io/travel-media/nhap/can-tho-p2/1.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/2.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/3.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/4.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/5.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/6.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/7.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/8.jpg?v=2", "https://buitansang.github.io/travel-media/nhap/can-tho-p2/9.jpg?v=2"], "caption": "Cần Thơ chơi gì phần 2: 5 điểm ngoài chợ nổi, chỗ nào đáng tiền\n\nBài trước đã có chợ nổi Cái Răng, bến Ninh Kiều, Giàn Gừa. Đây là 5 điểm còn lại — và nói thật chỗ nào đáng bỏ tiền, chỗ nào chụp bên ngoài là đủ.\n📍 Lò hủ tiếu Sáu Hoài (An Bình) — Cách chợ nổi Cái Răng khoảng 2km, đi đò qua con rạch nhỏ chừng 5 đến 10 phút, nhiều lái đò cho ghé luôn sau khi đi chợ. Được xem cách làm hủ tiếu: buổi sáng tráng bánh, buổi chiều cắt sợi. Lò còn làm hủ tiếu ngũ sắc bằng màu tự nhiên — xanh từ lá dứa, đỏ từ gấc, vàng từ nghệ, tím từ lá cẩm. Món nên thử là pizza hủ tiếu — hủ tiếu chiên giòn từng nắm. Đi ô tô thì đỗ gần cầu rồi đi bộ khoảng 100m vào hẻm, mùa mưa hẻm có thể ngập. Có bán đặc sản, nhưng có review nói đồ gỗ bày bán không phải làm tại chỗ, nên xem kỹ trước khi mua.\n📍 Làng du lịch Mỹ Khánh (An Bình, Phong Điền cũ) — Hơn 6.000 lượt đánh giá trên Google Maps. Vé cổng khoảng 150k, trẻ dưới 1m miễn phí, vào trong các trò chơi mua vé riêng, có trò 100k chạy chưa được 3 phút. Xem đua heo, xiếc khỉ thì miễn phí, muốn đặt cược đua heo đua chó thì 20k một lượt. Vườn trái cây theo mùa — có khách đến đầu tháng 8 thì vườn không có trái. Nói thẳng: review mấy tuần gần đây chê khá nhiều về vệ sinh và thái độ nhân viên. Đi nhóm đông thì vui hơn đi lẻ.\n📍 Nhà cổ Bình Thủy (Bình Thủy) — Nơi quay bộ phim Người tình (L'Amant), ngoài kiểu Pháp trong kiểu Á Đông, gia đình họ Dương vẫn đang sống ở đây. Vé giờ là 30k — nhiều trang mạng vẫn ghi giá cũ 15-20k. Trưa nhà có nghỉ, các nguồn ghi giờ khác nhau từ 11h30 đến 14h, nên tránh đến khung giờ này. Mang máy ảnh vào chụp sẽ bị thu thêm, mức thu mỗi người nghe một kiểu nên hỏi giá trước. Bên trong không có người thuyết minh hay bảng chú thích, nên khá nhiều người thấy đứng ngoài cổng chụp là đủ. Ai mê phim hoặc thích đồ cổ thì vẫn nên vào.\n📍 Đền thờ Vua Hùng (Bình Thủy) — Khánh thành tháng 4/2022, gần sân bay Cần Thơ. Vào cửa miễn phí. Đền chính thiết kế theo hình trống đồng, quanh đền có 18 vòm cung tượng trưng 18 đời Vua Hùng và 54 cột đá cho 54 dân tộc. Sân rất rộng nhưng ít bóng cây, trưa khá nắng. Bảo vệ thường cho gửi xe ở ngoài, xe máy 5k, ô tô 20k. Ngày thường vắng, dịp lễ mới đông.\n📍 Cồn Sơn (Bình Thủy) — Cù lao du lịch cộng đồng giữa sông Hậu, đi đò từ bến Cô Bắc qua. Trên cồn có bè cá, xem cá lóc bay, massage cá, ăn trái cây tại vườn, tự tay làm bánh lá mít và cốm nổ với người dân. Lối vào bến khó tìm và ít chỗ đậu ô tô, nên đặt tour có hướng dẫn viên đón ở bến. Có khách kể hỏi vé 6 điểm 390k nhưng chỉ được dẫn 3 điểm mà vẫn tính 350k — nên hỏi rõ tour gồm những điểm nào trước khi trả tiền. Ra bè cá thì chọn tàu to, đi đò nhỏ trên sông lớn khá sợ. Trời nóng, đi buổi sáng dễ chịu hơn.\n💡 Tips du lịch:\n• Nhà cổ Bình Thủy, đền Vua Hùng và Cồn Sơn nằm gần nhau, ghép chung một buổi\n• Lò hủ tiếu Sáu Hoài ghép luôn với chợ nổi Cái Răng buổi sáng sớm\n• Nhà cổ nghỉ trưa, tránh đến khoảng 12h đến 14h\n• Từ 01/07/2025 Cần Thơ đã gộp thêm Sóc Trăng và Hậu Giang, bài này chỉ nói Cần Thơ cũ\nBạn sẽ bỏ 30k vào nhà cổ hay đứng ngoài cổng chụp là đủ?\n#cantho #dulichcantho #conson #nhacobinhthuy #mientay #kinhnghiemdulich", "dia_danh": "Cần Thơ | Lò hủ tiếu Sáu Hoài | Làng du lịch Mỹ Khánh | Nhà cổ Bình Thủy | Nhà cổ Bình Thủy | Đền thờ Vua Hùng | Cồn Sơn | Cồn Sơn | Cần Thơ", "phu_de": "Ngoài chợ nổi còn 5 điểm, có chỗ vào miễn phí\nChỗ nào đáng tiền, chỗ nào chụp ngoài là đủ | Từ chợ nổi Cái Răng đi đò 5 đến 10 phút là tới\nCó hủ tiếu ngũ sắc, màu xanh là từ lá dứa\nMón nên thử là pizza hủ tiếu chiên giòn | Vé cổng khoảng 150k, trò chơi mua vé riêng\nXem đua heo, xiếc khỉ miễn phí, đặt cược mất 20k\nVườn trái cây theo mùa, có lúc tới không có trái | Nơi quay phim Người tình, gia đình vẫn đang ở\nVé giờ là 30k, nhiều trang mạng còn ghi giá cũ\nTrưa có nghỉ, tránh đến khoảng 12h đến 14h | Mang máy ảnh vào chụp bị thu thêm, hỏi giá trước\nBên trong không có người thuyết minh\nNhiều người thấy chụp ngoài cổng là đủ | Vào cửa miễn phí, gửi xe ngoài 5k xe máy\nĐền h
